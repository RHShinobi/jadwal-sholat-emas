
name: Build Jadwal Sholat Emas APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JadwalSholatEmas-Starter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o JadwalSholatEmas-Starter.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-Sholat-Emas-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

